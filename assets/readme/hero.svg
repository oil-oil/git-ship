<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">git-ship</title>
  <desc id="desc">A guarded release lane that moves working-tree changes through main sync, branch, pull request, and squash merge.</desc>

  <rect width="1200" height="400" rx="28" fill="#0C0F0E"/>

  <g stroke="#27302D" stroke-width="1">
    <path d="M0 64H1200M0 128H1200M0 192H1200M0 256H1200M0 320H1200"/>
    <path d="M64 0V400M128 0V400M192 0V400M256 0V400M320 0V400M384 0V400M448 0V400M512 0V400M576 0V400M640 0V400M704 0V400M768 0V400M832 0V400M896 0V400M960 0V400M1024 0V400M1088 0V400M1152 0V400"/>
  </g>

  <g transform="translate(64 50)">
    <rect width="196" height="30" rx="15" fill="#18211E" stroke="#3B4A45"/>
    <circle cx="18" cy="15" r="5" fill="#59D185"/>
    <text x="34" y="20" fill="#B7C2BE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600">CODEX AGENT SKILL</text>

    <text x="0" y="132" fill="#F4F1E8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="88" font-weight="750" letter-spacing="-4">git-ship</text>
    <text x="2" y="178" fill="#B7C2BE" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="500">One guarded lane from working tree to main.</text>

    <g transform="translate(0 226)">
      <text x="0" y="20" fill="#F2B84B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">$ ship</text>
      <text x="0" y="56" fill="#899590" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">infer names · stop on conflicts · never force</text>
    </g>
  </g>

  <g transform="translate(704 55)">
    <rect width="432" height="290" rx="20" fill="#111614" stroke="#38443F" stroke-width="2"/>
    <g transform="translate(24 22)">
      <circle cx="7" cy="7" r="5" fill="#F06A6A"/>
      <circle cx="27" cy="7" r="5" fill="#F2B84B"/>
      <circle cx="47" cy="7" r="5" fill="#59D185"/>
      <text x="300" y="12" fill="#65706C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">release lane</text>
    </g>

    <path d="M54 91H378" fill="none" stroke="#3B4A45" stroke-width="4" stroke-linecap="round"/>
    <path d="M54 91H324" fill="none" stroke="#59D185" stroke-width="4" stroke-linecap="round"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">
      <g transform="translate(54 91)">
        <circle r="13" fill="#59D185"/>
        <path d="M-5 0l3 3 7-8" fill="none" stroke="#0C0F0E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text y="34" fill="#B7C2BE">stash</text>
      </g>
      <g transform="translate(108 91)">
        <circle r="13" fill="#59D185"/>
        <path d="M-5 0l3 3 7-8" fill="none" stroke="#0C0F0E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text y="34" fill="#B7C2BE">sync</text>
      </g>
      <g transform="translate(162 91)">
        <circle r="13" fill="#59D185"/>
        <path d="M-5 0l3 3 7-8" fill="none" stroke="#0C0F0E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text y="34" fill="#B7C2BE">branch</text>
      </g>
      <g transform="translate(216 91)">
        <circle r="13" fill="#59D185"/>
        <path d="M-5 0l3 3 7-8" fill="none" stroke="#0C0F0E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text y="34" fill="#B7C2BE">commit</text>
      </g>
      <g transform="translate(270 91)">
        <circle r="13" fill="#59D185"/>
        <path d="M-5 0l3 3 7-8" fill="none" stroke="#0C0F0E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text y="34" fill="#B7C2BE">verify</text>
      </g>
      <g transform="translate(324 91)">
        <circle r="13" fill="#F2B84B"/>
        <text y="5" fill="#0C0F0E" font-size="15" font-weight="800">PR</text>
        <text y="34" fill="#F2B84B">review</text>
      </g>
      <g transform="translate(378 91)">
        <circle r="13" fill="#151C19" stroke="#65706C" stroke-width="2"/>
        <text y="5" fill="#899590" font-size="12" font-weight="800">M</text>
        <text y="34" fill="#899590">main</text>
      </g>
    </g>

    <g transform="translate(26 176)">
      <rect width="380" height="76" rx="12" fill="#0C0F0E" stroke="#27302D"/>
      <text x="18" y="29" fill="#F2B84B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">TARGET</text>
      <text x="18" y="55" fill="#F4F1E8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">main ← feat/your-change</text>
      <rect x="305" y="20" width="57" height="32" rx="16" fill="#183224"/>
      <text x="333.5" y="41" fill="#72E29A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="800" text-anchor="middle">SAFE</text>
    </g>
  </g>
</svg>
